<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SentiStream · Analytics</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <style>
    :root {
      --bg:       #080c12;
      --surface:  #0d1420;
      --surface2: #111927;
      --border:   #1a2540;
      --accent:   #00e5a0;
      --accent2:  #0066ff;
      --text:     #e8edf5;
      --muted:    #5a6a8a;
      --positive: #00e5a0;
      --negative: #ff3d6b;
      --neutral:  #ffb800;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(0,229,160,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,160,0.02) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none; z-index: 0;
    }

    /* ── Header ── */
    header {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 32px; height: 60px;
      background: rgba(8,12,18,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .back {
      display: flex; align-items: center; gap: 8px;
      text-decoration: none; color: var(--muted);
      font-size: 13px; transition: color 0.2s;
    }
    .back:hover { color: var(--accent); }
    .header-center {
      font-family: 'Space Mono', monospace;
      font-size: 13px; color: var(--text);
    }
    .header-right {
      font-family: 'Space Mono', monospace;
      font-size: 11px; color: var(--muted);
    }

    /* ── Page ── */
    .page {
      position: relative; z-index: 1;
      max-width: 1400px;
      margin: 0 auto;
      padding: 32px;
    }

    /* ── Top KPIs ── */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }
    .kpi {
      padding: 20px 24px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
    }
    .kpi-value {
      font-family: 'Space Mono', monospace;
      font-size: 26px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 6px;
    }
    .kpi-value.green  { color: var(--positive); }
    .kpi-value.red    { color: var(--negative); }
    .kpi-value.yellow { color: var(--neutral); }
    .kpi-value.blue   { color: #4d9fff; }
    .kpi-label { font-size: 12px; color: var(--muted); }

    /* ── Section heading ── */
    .section-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
    }
    .section-title {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ── Chart cards ── */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 28px;
    }
    .card {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      padding: 24px;
    }
    .card-title {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 20px;
    }
    .chart-wrap {
      position: relative;
      height: 300px;
    }

    /* ── Product analyzer ── */
    .product-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      padding: 24px;
      margin-bottom: 28px;
    }
    .product-head {
      display: flex; align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .product-title {
      font-family: 'Space Mono', monospace;
      font-size: 12px; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .input-row {
      display: flex; gap: 10px; align-items: center;
    }
    input[type="text"] {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 6px;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      width: 260px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    input[type="text"]::placeholder { color: var(--muted); }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 20px;
      background: var(--accent);
      color: #080c12;
      border: none; border-radius: 6px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px; font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }
    .btn:hover { background: #00ffb3; transform: translateY(-1px); }

    .product-stats {
      display: flex; gap: 12px;
    }
    .pstat {
      flex: 1; padding: 16px 20px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface2);
      text-align: center;
    }
    .pstat-value {
      font-family: 'Space Mono', monospace;
      font-size: 28px; font-weight: 700;
      line-height: 1; margin-bottom: 4px;
    }
    .pstat-value.green  { color: var(--positive); }
    .pstat-value.red    { color: var(--negative); }
    .pstat-value.yellow { color: var(--neutral); }
    .pstat-label { font-size: 11px; color: var(--muted); }

    .product-charts {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 24px;
      align-items: center;
    }
    .pie-wrap { position: relative; height: 240px; }
    .product-detail {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      line-height: 2;
    }
    .product-detail strong { color: var(--text); }

    /* ── Loading ── */
    .loading {
      display: flex; align-items: center; gap: 8px;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      font-size: 11px;
    }
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 900px) {
      .kpi-row { grid-template-columns: repeat(2, 1fr); }
      .grid-2  { grid-template-columns: 1fr; }
      .product-charts { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <a href="/" class="back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
      Dashboard
    </a>
    <div class="header-center">Offline Analytics</div>
    <div class="header-right" id="doc-count">Loading...</div>
  </header>

  <div class="page">

    <!-- KPIs -->
    <div class="kpi-row">
      <div class="kpi">
        <div class="kpi-value green" id="kpi-total">—</div>
        <div class="kpi-label">Total Predictions</div>
      </div>
      <div class="kpi">
        <div class="kpi-value green" id="kpi-positive">—</div>
        <div class="kpi-label">Positive Reviews</div>
      </div>
      <div class="kpi">
        <div class="kpi-value red" id="kpi-negative">—</div>
        <div class="kpi-label">Negative Reviews</div>
      </div>
      <div class="kpi">
        <div class="kpi-value yellow" id="kpi-neutral">—</div>
        <div class="kpi-label">Neutral Reviews</div>
      </div>
    </div>

    <!-- Charts row -->
    <div class="grid-2">
      <div class="card">
        <div class="card-title">Sentiment Predictions by Month</div>
        <div class="chart-wrap">
          <canvas id="barChart"></canvas>
        </div>
      </div>
      <div class="card">
        <div class="card-title">Overall Sentiment Distribution</div>
        <div class="chart-wrap">
          <canvas id="doughnutChart"></canvas>
        </div>
      </div>
    </div>

    <!-- Product analyzer -->
    <div class="product-card">
      <div class="product-head">
        <div>
          <div class="product-title">Product Sentiment Analyzer</div>
          <div class="input-row">
            <input type="text" id="productInput"
                   placeholder="Enter ProductId e.g. B001E4KFG0"
                   value="B001E4KFG0"/>
            <button class="btn" onclick="loadProduct()">
              Analyze
            </button>
          </div>
        </div>
        <div class="product-stats" id="product-stats" style="display:none">
          <div class="pstat">
            <div class="pstat-value green" id="p-positive">0</div>
            <div class="pstat-label">Positive</div>
          </div>
          <div class="pstat">
            <div class="pstat-value red" id="p-negative">0</div>
            <div class="pstat-label">Negative</div>
          </div>
          <div class="pstat">
            <div class="pstat-value yellow" id="p-neutral">0</div>
            <div class="pstat-label">Neutral</div>
          </div>
        </div>
      </div>

      <div class="product-charts">
        <div class="pie-wrap">
          <canvas id="pieChart"></canvas>
        </div>
        <div class="product-detail" id="product-detail">
          Select a product to see its sentiment breakdown.
        </div>
      </div>
    </div>

  </div>

  <script>
    // ── Chart defaults ──────────────────────────────────────
    Chart.defaults.color          = '#5a6a8a';
    Chart.defaults.borderColor    = '#1a2540';
    Chart.defaults.font.family    = "'Space Mono', monospace";
    Chart.defaults.font.size      = 10;

    const COLORS = {
      positive: '#00e5a0',
      negative: '#ff3d6b',
      neutral:  '#ffb800',
    };

    let barChart, doughnutChart, pieChart;

    // ── Load overview data ──────────────────────────────────
    fetch('/api/by_date')
      .then(r => r.json())
      .then(data => {
        const labels   = data.map(d => d.date);
        const positive = data.map(d => d.positive);
        const negative = data.map(d => d.negative);
        const neutral  = data.map(d => d.neutral);

        const totalPos = positive.reduce((a,b) => a+b, 0);
        const totalNeg = negative.reduce((a,b) => a+b, 0);
        const totalNeu = neutral.reduce((a,b) => a+b, 0);
        const total    = totalPos + totalNeg + totalNeu;

        document.getElementById('kpi-total').textContent    = total.toLocaleString();
        document.getElementById('kpi-positive').textContent = totalPos.toLocaleString();
        document.getElementById('kpi-negative').textContent = totalNeg.toLocaleString();
        document.getElementById('kpi-neutral').textContent  = totalNeu.toLocaleString();
        document.getElementById('doc-count').textContent    = total.toLocaleString() + ' records';

        // Bar chart
        const barCtx = document.getElementById('barChart').getContext('2d');
        barChart = new Chart(barCtx, {
          type: 'bar',
          data: {
            labels,
            datasets: [
              { label: 'Positive', data: positive, backgroundColor: 'rgba(0,229,160,0.8)',   borderRadius: 2 },
              { label: 'Negative', data: negative, backgroundColor: 'rgba(255,61,107,0.8)',  borderRadius: 2 },
              { label: 'Neutral',  data: neutral,  backgroundColor: 'rgba(255,184,0,0.8)',   borderRadius: 2 },
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              x: {
                stacked: true,
                grid: { color: '#1a2540' },
                ticks: { maxRotation: 45 }
              },
              y: {
                stacked: true,
                beginAtZero: true,
                grid: { color: '#1a2540' }
              }
            },
            plugins: {
              legend: {
                position: 'top',
                labels: { boxWidth: 10, padding: 16 }
              }
            }
          }
        });

        // Doughnut chart
        const dCtx = document.getElementById('doughnutChart').getContext('2d');
        doughnutChart = new Chart(dCtx, {
          type: 'doughnut',
          data: {
            labels: ['Positive', 'Negative', 'Neutral'],
            datasets: [{
              data: [totalPos, totalNeg, totalNeu],
              backgroundColor: [COLORS.positive, COLORS.negative, COLORS.neutral],
              borderColor: '#080c12',
              borderWidth: 3,
              hoverOffset: 8
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '65%',
            plugins: {
              legend: {
                position: 'bottom',
                labels: { boxWidth: 10, padding: 20 }
              }
            }
          }
        });
      });

    // ── Product analyzer ────────────────────────────────────
    function loadProduct() {
      const pid = document.getElementById('productInput').value.trim();
      if (!pid) return;

      fetch(`/api/product/${pid}`)
        .then(r => r.json())
        .then(data => {
          const c = data.counts;
          const t = data.total;

          document.getElementById('p-positive').textContent = c.positive;
          document.getElementById('p-negative').textContent = c.negative;
          document.getElementById('p-neutral').textContent  = c.neutral;
          document.getElementById('product-stats').style.display = 'flex';

          const posP = t > 0 ? (c.positive / t * 100).toFixed(1) : 0;
          const negP = t > 0 ? (c.negative / t * 100).toFixed(1) : 0;
          const neuP = t > 0 ? (c.neutral  / t * 100).toFixed(1) : 0;

          document.getElementById('product-detail').innerHTML = `
            <div>Product ID</div>
            <strong>${pid}</strong>
            <br/><br/>
            <div>Total Reviews</div>
            <strong>${t.toLocaleString()}</strong>
            <br/><br/>
            <div>Positive Rate</div>
            <strong style="color:var(--positive)">${posP}%</strong>
            <br/>
            <div>Negative Rate</div>
            <strong style="color:var(--negative)">${negP}%</strong>
            <br/>
            <div>Neutral Rate</div>
            <strong style="color:var(--neutral)">${neuP}%</strong>
            <br/><br/>
            <div>Sentiment Score</div>
            <strong style="color:var(--accent)">${posP > 60 ? '🟢 Strong Positive' : negP > 30 ? '🔴 Concerning' : '🟡 Mixed'}</strong>
          `;

          if (pieChart) pieChart.destroy();
          const pCtx = document.getElementById('pieChart').getContext('2d');
          pieChart = new Chart(pCtx, {
            type: 'doughnut',
            data: {
              labels: ['Positive', 'Negative', 'Neutral'],
              datasets: [{
                data: [c.positive, c.negative, c.neutral],
                backgroundColor: [COLORS.positive, COLORS.negative, COLORS.neutral],
                borderColor: '#080c12',
                borderWidth: 3,
                hoverOffset: 6
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              cutout: '60%',
              plugins: {
                legend: { display: false },
                title: {
                  display: true,
                  text: `${pid} · ${t} reviews`,
                  color: '#5a6a8a',
                  font: { size: 10, family: "'Space Mono', monospace" },
                  padding: { bottom: 16 }
                }
              }
            }
          });
        });
    }

    loadProduct();
  </script>
</body>
</html>
