<!DOCTYPE html>
<html>
<head>
  <title>Amazon Sentiment Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; 
           display: flex; justify-content: center; align-items: center; 
           height: 100vh; margin: 0; }
    .container { text-align: center; }
    h1 { color: #232f3e; }
    .buttons { margin-top: 30px; display: flex; gap: 20px; justify-content: center; }
    a.btn { padding: 20px 40px; border-radius: 8px; text-decoration: none;
            font-size: 18px; font-weight: bold; color: white; }
    .online  { background: #e47911; }
    .offline { background: #232f3e; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🛒 Amazon Review Sentiment Analysis</h1>
    <p>Real-time sentiment analysis powered by Kafka + Spark + MongoDB</p>
    <div class="buttons">
      <a href="/online"  class="btn online">📡 Online Stream</a>
      <a href="/offline" class="btn offline">📊 Offline Dashboard</a>
    </div>
  </div>
</body>
</html>
